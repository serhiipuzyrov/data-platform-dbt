name: Build and Deploy DBT

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ github.ref == 'refs/heads/main' && 'data-platform-prod-477621' || 'data-platform-dev-477621' }}
      PROJECT_NUMBER: ${{ github.ref == 'refs/heads/main' && '1076941767249' || '823642180837' }}
      DBT_TARGET: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      REGION: europe-central2
      REPOSITORY: data-platform-dbt
      IMAGE_NAME: dbt-image
      DOCS_IMAGE_NAME: dbt-docs-image
      DOCKERFILE_PATH: ./Dockerfile

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate to GCP via Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: "projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "terraform-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      # Configure Docker to use gcloud as a credential helper
      - name: Configure Docker
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest" -f $DOCKERFILE_PATH .

      # Run DBT inside Docker container to test
      - name: Test DBT build
        run: |
          docker run --rm \
            -e DBT_PROFILES_DIR=/.dbt \
            -e DBT_TARGET=${{ env.DBT_TARGET }} \
            -e DBT_AUTH_METHOD=oauth-secrets \
            -e CLOUDSDK_AUTH_ACCESS_TOKEN=${{ steps.auth.outputs.access_token }} \
            "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"

      # Push to Artifact Registry only if dbt run succeeded
      - name: Push image to Artifact Registry
        if: success()
        run: |
          docker push "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
          
      ### DBT Docs
      # Generate dbt docs and copy from container
      - name: Generate dbt docs
        if: success()
        run: |
          # Run dbt docs generate in a named container
          docker run --name dbt-docs-temp \
            -e DBT_PROFILES_DIR=/.dbt \
            -e DBT_TARGET=${{ env.DBT_TARGET }} \
            -e DBT_AUTH_METHOD=oauth-secrets \
            -e CLOUDSDK_AUTH_ACCESS_TOKEN=${{ steps.auth.outputs.access_token }} \
            "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest" \
            dbt docs generate --target ${{ env.DBT_TARGET }}
          # Copy target directory from container (WORKDIR is / so target is at /target)
          docker cp dbt-docs-temp:/target ./target
          # Clean up container
          docker rm dbt-docs-temp

      # Copy generated docs to dbt-docs folder
      - name: Copy docs artifacts
        if: success()
        run: |
          mkdir -p dbt-docs/static
          cp target/catalog.json target/manifest.json target/index.html dbt-docs/static/

      # Build docs image
      - name: Build docs image
        if: success()
        run: |
          cd dbt-docs
          docker build -t "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.DOCS_IMAGE_NAME }}:latest" .

      # Push docs image
      - name: Push docs image
        if: success()
        run: |
          docker push "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.DOCS_IMAGE_NAME }}:latest"

      # Deploy docs image to Cloud Run service
      - name: Deploy dbt docs to Cloud Run
        if: success()
        run: |
          gcloud run services update dbt-docs \
            --image="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.DOCS_IMAGE_NAME }}:latest" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      # Get DBT docs service URL
      - name: Print dbt docs URL
        if: success()
        run: |
          # Get the service URL
          SERVICE_URL=$(gcloud run services describe dbt-docs \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "DBT docs are available at: $SERVICE_URL"

      # Output success
      - name: Done
        if: success()
        run: echo "✅ DBT image successfully built and pushed!"