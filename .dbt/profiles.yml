data_platform_dbt:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('PROJECT_ID', 'data-platform-dev-477621') }}"
      dataset: dbt_dev
      location: "{{ env_var('REGION', 'europe-central2') }}"
      threads: 4
      timeout_seconds: 300
      keyfile: /tmp/adc.json
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('PROJECT_ID', 'data-platform-prod-477621') }}"
      dataset: dbt_prod
      location: "{{ env_var('REGION', 'europe-central2') }}"
      threads: 4
      timeout_seconds: 300
      keyfile: /tmp/adc.json