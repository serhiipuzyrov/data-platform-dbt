data_platform_dbt:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: "{{ env_var('DBT_AUTH_METHOD', 'oauth') }}"
      project: "data-platform-dev-477621"
      location: "europe-central2"
      compute_region: "europe-central2"
      dataproc_region: "europe-central2"
      gcs_bucket: "dbt-gcs-bucket-dev"
      threads: 4
      timeout_seconds: 300
      impersonate_service_account: "dbt-runner@data-platform-dev-477621.iam.gserviceaccount.com"
      token: "{{ env_var('CLOUDSDK_AUTH_ACCESS_TOKEN', '') }}"
    prod:
      type: bigquery
      method: "{{ env_var('DBT_AUTH_METHOD', 'oauth') }}"
      project: "data-platform-prod-477621"
      location: "europe-central2"
      compute_region: "europe-central2"
      dataproc_region: "europe-central2"
      gcs_bucket: "dbt-gcs-bucket-prod"
      threads: 4
      timeout_seconds: 300
      impersonate_service_account: "dbt-runner@data-platform-prod-477621.iam.gserviceaccount.com"
      token: "{{ env_var('CLOUDSDK_AUTH_ACCESS_TOKEN', '') }}"